[package]
name = "streamboat-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
description = "streamboat: the desktop shell and command-line client for TIDAL subscribers"
repository.workspace = true

[[bin]]
name = "streamboat"
path = "src/main.rs"

[features]
default = ["gstreamer"]
# Engine selection (D-016) forwarded to streamboat-player: GStreamer (with
# the ALSA writer and MPRIS) is the Linux build; libmpv (with SMTC and
# NowPlaying) is the Windows/macOS build. Release builds off Linux use
# `--no-default-features --features streamboat-desktop/mpv`.
gstreamer = ["streamboat-player/gstreamer", "streamboat-player/alsa-direct", "streamboat-player/mpris"]
mpv = ["streamboat-player/mpv", "streamboat-player/smtc", "streamboat-player/nowplaying"]

[dependencies]
streamboat-core.workspace = true
streamboat-player = { workspace = true, default-features = false }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
reqwest.workspace = true
futures.workspace = true
futures-util.workspace = true
image.workspace = true
thiserror.workspace = true
tokio-tungstenite.workspace = true
iced = { workspace = true, features = ["tokio", "image", "svg", "advanced", "debug"] }
# `streamboat snapcast-plugin` bridges to a running daemon's control API
# (D-034) over the same HTTP+WebSocket protocol `streamboat-server`'s own
# tests use (tokio-tungstenite/futures-util above); `snapcast-discover`
# finds a snapserver via mDNS.
mdns-sd = "0.21.3"

# System tray (task item 2, D-014). Linux uses ksni (StatusNotifierItem over
# D-Bus, no GTK dependency — `mpris.rs` already takes the same "own
# dedicated thread with a current-thread tokio runtime" shape for the same
# reason). Windows/macOS use tray-icon, cfg-gated and compile-checked only:
# there is no Windows/macOS CI runner or display here, see
# `ui::tray`'s doc comment for exactly what is and isn't verified.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24"

[dev-dependencies]
iced_test.workspace = true
streamboat-server = { path = "../streamboat-server" }
wiremock.workspace = true
base64.workspace = true
axum.workspace = true
tempfile.workspace = true

# Packaging metadata (D-041). deb/rpm depend on the distro's own GStreamer
# for this first cut, not the /opt/streamboat vendored tree D-041 describes
# -- see packaging/README.md "Why deb/rpm depend on the distro's GStreamer
# for now" and packaging/linux/vendor-gstreamer.sh for the follow-up. The
# plugin packages below are dlopen'd by GStreamer's registry scan at
# runtime, not linked directly, so `cargo deb`'s automatic `dpkg-shlibdeps`
# pass (the `$auto` token) cannot discover them on its own; they are listed
# explicitly instead, mirroring exactly what .github/workflows/ci.yml
# installs and has verified actually runs the workspace's own test suite.
[package.metadata.deb]
name = "streamboat"
maintainer = "streamboat contributors <streamboat@users.noreply.github.com>"
copyright = "2026, streamboat contributors"
section = "sound"
priority = "optional"
extended-description = """\
streamboat is a desktop client and command-line tool for TIDAL, for people \
who already pay for a TIDAL subscription. It talks to the same unofficial \
api.tidal.com API that other open-source TIDAL clients use and needs your \
own active subscription -- it is not affiliated with, endorsed by, or \
sponsored by TIDAL. It is a player, not a downloader: it never decrypts \
protected streams and never produces a playable file that outlives your \
subscription."""
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav, gstreamer1.0-alsa"
assets = [
    { source = "target/release/streamboat", dest = "usr/bin/streamboat", mode = "755" },
    { source = "../../packaging/linux/io.github.waayway.streamboat.desktop", dest = "usr/share/applications/io.github.waayway.streamboat.desktop", mode = "644" },
    { source = "../../packaging/linux/io.github.waayway.streamboat.metainfo.xml", dest = "usr/share/metainfo/io.github.waayway.streamboat.metainfo.xml", mode = "644" },
    { source = "../../packaging/linux/io.github.waayway.streamboat.svg", dest = "usr/share/icons/hicolor/scalable/apps/io.github.waayway.streamboat.svg", mode = "644" },
]

[package.metadata.generate-rpm]
name = "streamboat"
summary = "Play TIDAL with your own subscription; not affiliated with TIDAL"
assets = [
    { source = "target/release/streamboat", dest = "/usr/bin/streamboat", mode = "755" },
    { source = "../../packaging/linux/io.github.waayway.streamboat.desktop", dest = "/usr/share/applications/io.github.waayway.streamboat.desktop", mode = "644" },
    { source = "../../packaging/linux/io.github.waayway.streamboat.metainfo.xml", dest = "/usr/share/metainfo/io.github.waayway.streamboat.metainfo.xml", mode = "644" },
    { source = "../../packaging/linux/io.github.waayway.streamboat.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.waayway.streamboat.svg", mode = "644" },
]

# `dpkg`'s shlib-based dependency discovery has no rpm equivalent wired up
# by default here, so the same dlopen'd GStreamer plugin set is listed
# explicitly, plus the shared libraries auto-req (ldd-based, the default
# --auto-req mode) will not find because they too are dlopen'd rather than
# linked. Distro package names below are Fedora's; adjust per the actual
# target (see packaging/README.md).
[package.metadata.generate-rpm.requires]
gstreamer1 = "*"
"gstreamer1-plugins-base" = "*"
"gstreamer1-plugins-good" = "*"
"gstreamer1-plugins-bad-free" = "*"
"gstreamer1-libav" = "*"
alsa-lib = "*"
