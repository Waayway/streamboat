[package]
name = "streamboat-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
description = "streamboat: the desktop shell and command-line client for TIDAL subscribers"
repository.workspace = true

[[bin]]
name = "streamboat"
path = "src/main.rs"

[features]
default = []
# The libmpv engine backend for Windows/macOS (D-016) is being built by
# another agent in `streamboat-player`. This feature only exists so the
# desktop shell's `cfg`-gated call site (`src/ui/engine_select.rs`) has
# something to turn on once that backend lands; it does nothing on its own
# today. See that module's doc comment for the exact compile-time gate.
mpv = []

[dependencies]
streamboat-core.workspace = true
streamboat-player.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
gstreamer.workspace = true
reqwest.workspace = true
futures.workspace = true
futures-util.workspace = true
image.workspace = true
thiserror.workspace = true
tokio-tungstenite.workspace = true
iced = { workspace = true, features = ["tokio", "image", "svg", "advanced", "debug"] }

# System tray (task item 2, D-014). Linux uses ksni (StatusNotifierItem over
# D-Bus, no GTK dependency — `mpris.rs` already takes the same "own
# dedicated thread with a current-thread tokio runtime" shape for the same
# reason). Windows/macOS use tray-icon, cfg-gated and compile-checked only:
# there is no Windows/macOS CI runner or display here, see
# `ui::tray`'s doc comment for exactly what is and isn't verified.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24"

[dev-dependencies]
iced_test.workspace = true
streamboat-server = { path = "../streamboat-server" }
wiremock.workspace = true
base64.workspace = true
axum.workspace = true
tempfile.workspace = true
