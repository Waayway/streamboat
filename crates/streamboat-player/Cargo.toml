[package]
name = "streamboat-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
description = "streamboat's audio engine: the Engine trait, the GStreamer and libmpv backends, queue and playback state"
repository.workspace = true

[features]
default = ["gstreamer"]
gstreamer = ["dep:gstreamer", "dep:gstreamer-audio"]

[dependencies]
streamboat-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
base64.workspace = true
uuid.workspace = true
gstreamer = { workspace = true, optional = true }
gstreamer-audio = { workspace = true, optional = true }

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
