[package]
name = "streamboat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "TIDAL API client, authentication, manifest parsing and the shared command/event protocol for streamboat"
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
url.workspace = true
base64.workspace = true
uuid.workspace = true
directories.workspace = true
aes-gcm = { workspace = true, features = ["std"] }
rand.workspace = true
zeroize.workspace = true
roxmltree = "0.20"
sha2.workspace = true
hex.workspace = true
fd-lock.workspace = true
keyring = { workspace = true, optional = true }
tokio-tungstenite.workspace = true
futures-util.workspace = true
async-trait.workspace = true
md-5.workspace = true
httpdate.workspace = true
tracing-subscriber.workspace = true
# Log/crash-report redaction (D-029): masking bearer tokens, session ids and
# similar patterns in a structured log line or a captured panic message.
regex = "1"
# Rotates `<data dir>/logs/streamboat.log` at a fixed byte size, keeping a
# bounded number of numbered backups (D-029) — `tracing-appender`'s own
# `RollingFileAppender` only rotates on a time interval, not a size, so it
# does not fit this requirement.
file-rotate = "0.8"
# The debug bundle (D-029) is a single archive format via a single crate,
# deflate only (no need for the encryption/other-codec feature surface).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
