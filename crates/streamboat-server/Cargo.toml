[package]
name = "streamboat-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
description = "streamboatd: the headless streamboat daemon (control API, MPRIS, streaming privileges)"
repository.workspace = true

[lib]
name = "streamboat_server"
path = "src/lib.rs"

[[bin]]
name = "streamboatd"
path = "src/main.rs"

[features]
default = ["mpris"]
# Forwarded to streamboat-player: registration happens in the player layer
# (D-030), streamboatd just starts the task. No-op off Linux.
mpris = ["streamboat-player/mpris"]

[dependencies]
streamboat-core.workspace = true
streamboat-player.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
wiremock.workspace = true
