ShortDescription: Play TIDAL with your own subscription; not affiliated with TIDAL
Description: >-
  streamboat is an open-source desktop client and command-line tool for
  TIDAL, for people who already pay for a TIDAL subscription. It talks to
  the same unofficial api.tidal.com API that other open-source TIDAL
  clients use and needs your own active subscription to work. It is not
  affiliated with, endorsed by, or sponsored by TIDAL. It is a player, not
  a downloader: it never decrypts protected streams and never produces a
  playable file that outlives your subscription.
