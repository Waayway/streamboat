<?xml version="1.0" encoding="UTF-8"?>
<!--
  streamboat app icon.

  Original artwork: a paper-boat hull and sail with three sound-wave arcs
  standing in for the sail's "wind" -- a boat that streams. Deliberately not
  a reference to TIDAL's own wave mark: no chevrons, no wave-of-triangles
  motif, different silhouette and colour entirely. Square, scalable, no
  baked-in drop shadow, per the AppStream/Flathub icon guidelines this
  metainfo also follows (see packaging/README.md).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#2f8fd6"/>
      <stop offset="1" stop-color="#0d3a5c"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- mast -->
  <rect x="105" y="88" width="7" height="82" rx="3.5" fill="#f5f9fc"/>

  <!-- sail -->
  <path d="M112 94 L170 138 L112 142 Z" fill="#f5f9fc"/>

  <!-- hull -->
  <path
    d="M62 168
       L194 168
       C194 168 190 202 128 202
       C66 202 62 168 62 168 Z"
    fill="#f5f9fc"/>
  <path d="M74 178 L182 178" stroke="#0d3a5c" stroke-width="6" stroke-linecap="round" opacity="0.35"/>

  <!-- streaming waves off the sail -->
  <path d="M182 100 A34 34 0 0 1 182 148" fill="none" stroke="#f5f9fc" stroke-width="9" stroke-linecap="round"/>
  <path d="M196 88 A52 52 0 0 1 196 160" fill="none" stroke="#f5f9fc" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <path d="M210 76 A70 70 0 0 1 210 172" fill="none" stroke="#f5f9fc" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
</svg>
